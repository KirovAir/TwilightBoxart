# Builds the DS/DSi homebrew client with BlocksDS. Runs on every push - it is the only compile
# check main.c gets, since the toolchain lives in this container - and attaches the .nds to the
# GitHub release when one is published.
name: DS/DSi client

on:
  push:
    branches: [ master, main ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Keep this in lockstep with dswifi-patched/lib/libdswifi9.a. BlocksDS 1.22.2 changed
    # O_NONBLOCK's value; mixing its headers with the 1.22.1 archive makes every connect fail.
    container: skylyrac/blocksds@sha256:6d885f5e4245b31feca2db5ab51924556145d539b5184cafdc40cd306ba34587
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make -C TwilightBoxart.DSi

      - uses: actions/upload-artifact@v4
        with:
          name: twilightboxart-ds-dsi
          path: TwilightBoxart.DSi/twilightboxart.nds

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: twilightboxart-ds-dsi
          path: dist

      - name: Name the release asset
        run: mv dist/twilightboxart.nds dist/TwilightBoxart-DS-DSi.nds

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/TwilightBoxart-DS-DSi.nds
